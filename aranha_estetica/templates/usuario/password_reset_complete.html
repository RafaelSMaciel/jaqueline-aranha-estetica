{% extends 'estrutura/base_auth.html' %}
{% block titulo %}Senha redefinida — {{ CLINIC_NAME }}{% endblock %}

{% block conteudo %}
<div class="bg-superficie border border-borda rounded-lg p-8 text-center">

  <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-green-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
  </div>

  <h1 class="text-2xl font-semibold text-texto mb-1">{{ CLINIC_NAME }}</h1>
  <h2 class="text-lg font-medium text-texto mt-4 mb-2">Senha redefinida!</h2>
  <p class="text-sm text-texto-suave mb-6">
    Sua senha foi alterada com sucesso. Agora você pode fazer login com sua nova senha.
  </p>

  <a href="{% url 'aranha:usuario_login' %}"
     class="inline-flex items-center justify-center rounded-md px-4 py-2.5 text-sm font-medium transition bg-marca-forte text-sobre-marca hover:opacity-90 no-underline">
    Fazer login
  </a>

</div>
{% endblock %}
