{% extends 'estrutura/base.html' %}
{% block titulo %}Obrigado | {{ CLINIC_NAME }}{% endblock %}
{% block conteudo %}
<section class="hero section" style="background: linear-gradient(135deg, #2C2C2C 0%, #4a3728 50%, #6D4C41 100%); padding: 4rem 0 5rem;">
    <div class="container text-center text-white" data-aos="fade-up">
        <div class="d-inline-flex align-items-center gap-2 mb-3 px-4 py-2 rounded-pill" style="background:rgba(201,168,76,0.2);border:1px solid rgba(201,168,76,0.5);">
            <i class="bi bi-check2-circle" style="color:#f0d98c;"></i>
            <span style="color:#f0d98c;font-size:0.72rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;">Recebido</span>
        </div>
        <h1 style="font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);color:white !important;">Obrigado!</h1>
        <p style="opacity:0.8;color:white !important;max-width:480px;margin:0 auto;">
            Sua opinião foi registrada e nos ajudará a evoluir o atendimento. Cuide-se!
        </p>
        <a href="{% url 'aranha:inicio' %}" class="btn btn-outline-light rounded-pill px-4 mt-4">
            <i class="bi bi-house-door me-2"></i>Voltar ao site
        </a>
    </div>
</section>
{% endblock %}
