{% extends 'estrutura/base_v2.html' %}

{% block titulo %}Obrigado | {{ CLINIC_NAME }}{% endblock %}

{% block conteudo %}
<div class="mx-auto max-w-xl px-6 py-16 text-center">

  <div class="flex justify-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-marca" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>

  <p class="text-xs font-bold uppercase tracking-widest text-marca mb-3">Recebido</p>

  <p class="text-texto-suave leading-relaxed mb-8">

  </p>

  <a href="{% url 'aranha:inicio' %}" class="inline-flex items-center gap-2 rounded-md bg-marca-forte px-6 py-2.5 text-sm font-semibold text-sobre-marca hover:opacity-90 transition-opacity">

      <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />

</div>
