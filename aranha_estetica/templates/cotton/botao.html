<c-vars variante="solido" tipo="button" loading="" class="" />
{% comment %}
Botao da marca. `class` e declarado em c-vars p/ ser MESCLADO ao class base
(sem isso sairia um 2o atributo class via {{ attrs }} e o navegador o ignoraria).
{% endcomment %}
<button type="{{ tipo }}"{% if loading %} disabled{% endif %}
        class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition {% if variante == 'ghost' %}border border-borda text-texto hover:bg-fundo{% elif variante == 'link' %}text-marca underline underline-offset-4{% else %}bg-marca-forte text-sobre-marca hover:opacity-90{% endif %}{% if loading %} opacity-60 cursor-not-allowed{% endif %} {{ class }}"
        {{ attrs }}>{% if loading %}<span aria-hidden="true" class="mr-2 inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>{% endif %}{{ slot }}</button>
