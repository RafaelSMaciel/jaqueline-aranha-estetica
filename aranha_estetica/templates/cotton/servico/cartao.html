<c-vars titulo="" texto="" />
{# Cartao de tratamento (grade das paginas de servico): icone no slot "icone", itens (<c-servico.item>) no slot. #}
<article class="rounded-xl border border-borda bg-superficie p-6 flex flex-col space-y-4">
  <div class="w-12 h-12 rounded-lg bg-fundo border border-borda flex items-center justify-center">
    {{ icone }}
  </div>
  <h3 class="text-texto font-bold text-lg">{{ titulo }}</h3>
  <p class="text-texto-suave text-sm leading-relaxed">
    {{ texto }}
  </p>
  <ul class="space-y-1.5 flex-1">
    {{ slot }}
  </ul>
  <a {% agendar_link %}
     class="inline-flex items-center gap-2 text-marca font-semibold text-sm hover:underline mt-auto pt-2">
    Agendar
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
</article>
