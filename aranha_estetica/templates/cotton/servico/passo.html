<c-vars numero="" titulo="" texto="" />
{# Passo do "Como funciona" das paginas de servico. O icone (svg) vai no slot. #}
<div class="relative text-center space-y-4 p-6 rounded-xl bg-fundo border border-borda">
  <span class="absolute -top-4 left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-marca-forte text-sobre-marca text-xs font-bold flex items-center justify-center">{{ numero }}</span>
  <div class="mx-auto w-12 h-12 rounded-full bg-superficie border border-borda flex items-center justify-center mt-2">
    {{ slot }}
  </div>
  <h3 class="text-texto font-semibold text-lg">{{ titulo }}</h3>
  <p class="text-texto-suave text-sm leading-relaxed">{{ texto }}</p>
</div>
