<c-vars nome="" label="" tipo="text" erro="" class="" />
<div class="flex flex-col gap-1">
  <label for="{{ nome }}" class="text-sm font-medium text-texto">{{ label }}</label>
  <input id="{{ nome }}" name="{{ nome }}" type="{{ tipo }}"
         class="rounded-md border border-borda bg-superficie px-3 py-2 text-texto {{ class }}"
         {% if erro %}aria-invalid="true" aria-describedby="{{ nome }}-erro"{% endif %}
         {{ attrs }}>
  {% if erro %}
    <span id="{{ nome }}-erro" class="text-erro text-sm">{{ erro }}</span>
  {% endif %}
</div>
