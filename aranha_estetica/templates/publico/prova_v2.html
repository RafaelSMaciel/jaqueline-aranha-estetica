{% extends 'estrutura/base_v2.html' %}
{% block titulo %}Prova da fundação{% endblock %}
{% block conteudo %}
<section class="mx-auto max-w-3xl px-6 py-16 space-y-8">
  <header class="space-y-2">
    <h1 class="text-4xl font-medium text-texto">Prova da fundação</h1>
    <p class="text-texto-suave">Tokens, tema (claro/escuro), e componentes cotton funcionando.</p>
  </header>

  <div class="flex flex-wrap gap-3">
    <c-botao variante="solido">Agendar</c-botao>
    <c-botao variante="ghost">Ver procedimentos</c-botao>
    <c-botao variante="link">Saiba mais</c-botao>
    <c-botao loading="true">Enviando</c-botao>
  </div>

  <c-card>
    <div class="space-y-4">
      <c-campo nome="email" label="E-mail" tipo="email" />
      <c-campo nome="cpf" label="CPF" erro="CPF inválido" />
    </div>
  </c-card>

  <div class="flex gap-2">
    <c-badge status="REALIZADO">Realizado</c-badge>
    <c-badge status="PENDENTE">Pendente</c-badge>
  </div>

  <c-toast tipo="sucesso">Tudo certo por aqui.</c-toast>
</section>
{% endblock %}
