# Lock de versoes (constraints) de TODAS as dependencias de runtime, inclusive
# transitivas — imagem de prod e CI instalam exatamente estas versoes:
#   Dockerfile: pip wheel -r requirements.txt -c requirements.lock
#   CI:         pip install -r requirements-dev.txt -c requirements.lock
# Sem ele, cryptography/django-otp/qrcode... eram resolvidos na hora do
# build e a imagem mudava entre o CI e o deploy do mesmo commit.
#
# Alvo: Linux x86_64, CPython 3.12 (python:3.12-slim). Sem hashes: o wheel
# escolhido varia com a glibc da imagem; a versao e o que fica fixo.
# Mudou requirements.txt? Regenere (qualquer SO) e rode o teste
# test_deploy_config.LockDependenciasTests, que confere as versoes diretas:
#   pip install --dry-run --ignore-installed --report r.json \
#     --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 \
#     --python-version 3.12 --implementation cp --abi cp312 --abi abi3 \
#     --abi none --only-binary=:all: -r requirements.txt
#   (pacote novo: junte `-c <este lock sem pywebpush/http-ece>` p/ manter os
#   pins atuais e so acrescentar o que falta)
#   -> um `nome==versao` por pacote de r.json ("install"), sem colorama
#   (so Windows). So-sdist (pywebpush 2.0.0 e http-ece) nao resolvem com
#   --only-binary: troque-os pelas dependencias deles e acrescente as versoes.
