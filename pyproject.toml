# Config de ferramentas (nao e pacote instalavel). Deps: requirements*.txt.
# Caches e dados das ferramentas ficam todos em .cache/ (ignorado): a raiz do repo so tem codigo e config.

[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"
extend-exclude = ["aranha_estetica/migrations", "node_modules"]

[tool.ruff.lint]
# Lista fixa (o padrao do ruff muda entre versoes): erros reais (F, E4/E7/E9) + fuso (DTZ).
# date.today()/datetime.now() sem fuso erram o dia entre 21h e 24h (servidor em UTC): use
# timezone.localdate()/localtime(); data/hora de formulario: utils/datas.ler_data/ler_hora.
select = ["E4", "E7", "E9", "F", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# testes montam datetime naive de proposito antes do make_aware (ou p/ o relogio do navegador)
"aranha_estetica/tests/**" = ["DTZ001", "DTZ007"]
"docs/gerar_requisitos.py" = ["E702"]

# Camadas (lint-imports; CI job Django SQLite): views > services > models. Para baixo pode, para
# cima nao — cada excecao abaixo e uma inversao consciente (import tardio dentro da funcao).
[tool.importlinter]
root_package = "aranha_estetica"

[[tool.importlinter.contracts]]
name = "Camadas: views > services > models"
type = "layers"
layers = ["aranha_estetica.views", "aranha_estetica.services", "aranha_estetica.models"]
ignore_imports = [
    # a FSM aplica os efeitos da transicao (caso de uso) na mesma transacao do status
    "aranha_estetica.models.agendamentos -> aranha_estetica.services.atendimento",
    # Profissional.horarios_disponiveis() delega ao SlotService (atalho p/ templates/admin)
    "aranha_estetica.models.profissionais -> aranha_estetica.services.disponibilidade",
]

[[tool.importlinter.contracts]]
name = "utils, db, jobs e comandos nao importam views"
type = "forbidden"
source_modules = [
    "aranha_estetica.utils", "aranha_estetica.db", "aranha_estetica.services", "aranha_estetica.models",
    "aranha_estetica.jobs", "aranha_estetica.jobs_manutencao", "aranha_estetica.management",
]
forbidden_modules = ["aranha_estetica.views"]

# Tipos nos services (mypy + django-stubs; CI job Django SQLite). So services/: o resto do app entra
# como dependencia (follow_imports=silent) sem cobrar anotacao.
[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy"
files = ["aranha_estetica/services"]
plugins = ["mypy_django_plugin.main"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "clinica.settings"

# Catraca de cobertura (CI job Django SQLite: coverage run ... && coverage report). fail_under e o
# piso atual: subiu a cobertura, suba o numero junto; nunca desca p/ caber um PR.
[tool.coverage.run]
source = ["aranha_estetica"]
data_file = ".cache/coverage"
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 86.9
precision = 1
show_missing = true
skip_covered = true
skip_empty = true
