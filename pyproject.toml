# Config de ferramentas (nao e pacote instalavel). Deps: requirements*.txt.
# Caches e dados das ferramentas ficam todos em .cache/ (ignorado): a raiz do repo so tem codigo e config.

[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"
extend-exclude = ["aranha_estetica/migrations", "node_modules"]

[tool.ruff.lint]
# Lista fixa (o padrao do ruff muda entre versoes): erros reais (F, E4/E7/E9) + fuso (DTZ).
# date.today()/datetime.now() sem fuso erram o dia entre 21h e 24h (servidor em UTC): use
# timezone.localdate()/localtime(); data/hora de formulario: utils/datas.ler_data/ler_hora.
# TID251: configuracao por ambiente so nos settings (os.environ lido no boot, com parse e validacao).
select = ["E4", "E7", "E9", "F", "DTZ", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Configuracao por ambiente so em clinica/settings: leia settings.X na hora da chamada."
"os.getenv".msg = "Configuracao por ambiente so em clinica/settings: leia settings.X na hora da chamada."

[tool.ruff.lint.per-file-ignores]
# testes montam datetime naive de proposito antes do make_aware (ou p/ o relogio do navegador) e
# montam o ambiente dos processos que importam os settings
"aranha_estetica/tests/**" = ["DTZ001", "DTZ007", "TID251"]
"docs/gerar_requisitos.py" = ["E702"]
# quem le o ambiente: os settings, os pontos de entrada (DJANGO_SETTINGS_MODULE), os geradores da
# documentacao, os comandos do pre-deploy (ADMIN_*), as opcoes do Sentry (montadas durante o import
# dos settings) e o modulo que ainda le o ambiente direto (lgpd: LGPD_RETENCAO_CLIENTE_DIAS)
"clinica/**" = ["TID251"]
"manage.py" = ["TID251"]
"docs/**" = ["TID251"]
"aranha_estetica/management/commands/**" = ["TID251"]
"aranha_estetica/utils/pii.py" = ["TID251"]
"aranha_estetica/services/lgpd.py" = ["TID251"]

# Camadas (lint-imports; CI job Django SQLite): views > services > models. Para baixo pode, para
# cima nao — cada excecao abaixo e uma inversao consciente (import tardio dentro da funcao).
[tool.importlinter]
root_package = "aranha_estetica"

[[tool.importlinter.contracts]]
name = "Camadas: views > services > models"
type = "layers"
layers = ["aranha_estetica.views", "aranha_estetica.services", "aranha_estetica.models"]
ignore_imports = [
    # a FSM aplica os efeitos da transicao (caso de uso) na mesma transacao do status
    "aranha_estetica.models.agendamentos -> aranha_estetica.services.atendimento",
]

[[tool.importlinter.contracts]]
name = "utils, db, jobs e comandos nao importam views"
type = "forbidden"
source_modules = [
    "aranha_estetica.utils", "aranha_estetica.db", "aranha_estetica.services", "aranha_estetica.models",
    "aranha_estetica.jobs", "aranha_estetica.jobs_manutencao", "aranha_estetica.management",
]
forbidden_modules = ["aranha_estetica.views"]

# utils = adaptadores de canal (e-mail, WhatsApp, SMS) e helpers: so transporte/formato. O caso de uso
# (quem recebe, link, Notificacao) mora em services; utils que importasse services inverteria a camada.
[[tool.importlinter.contracts]]
name = "utils nao importa services"
type = "forbidden"
source_modules = ["aranha_estetica.utils"]
forbidden_modules = ["aranha_estetica.services"]
# so o import direto: utils -> models -> services ja e coberto (e excecao consciente) no contrato de camadas
allow_indirect_imports = true

# Areas de views independentes: nenhuma importa outra (helper compartilhado vai p/ services/utils
# ou views.comum, fora do contrato). Cada area tem as suas rotas em urls/<area>.py.
[[tool.importlinter.contracts]]
name = "Areas de views independentes"
type = "independence"
modules = [
    "aranha_estetica.views.publico", "aranha_estetica.views.painel", "aranha_estetica.views.profissional",
    "aranha_estetica.views.conta", "aranha_estetica.views.infra",
]

# Tipos nos services (mypy + django-stubs; CI job Django SQLite). So services/: o resto do app entra
# como dependencia (follow_imports=silent) sem cobrar anotacao.
[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy"
files = ["aranha_estetica/services"]
plugins = ["mypy_django_plugin.main"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "clinica.settings"

# Catraca de cobertura (CI: `coverage run` nos jobs SQLite e Postgres, `coverage combine` +
# `coverage report` no job cobertura). Local: coverage run ... && coverage combine && coverage report.
# fail_under e o piso atual: subiu a cobertura, suba o numero junto; nunca desca p/ caber um PR.
[tool.coverage.run]
source = ["aranha_estetica"]
data_file = ".cache/coverage"
omit = ["*/migrations/*", "*/tests/*"]
# um arquivo por execucao (.cache/coverage.<maquina>.<pid>...), combinados entre os jobs do CI
parallel = true
relative_files = true

[tool.coverage.report]
fail_under = 86.9
precision = 1
show_missing = true
skip_covered = true
skip_empty = true
